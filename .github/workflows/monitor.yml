name: flight-price-monitor

on:
  schedule:
    # Это «пульс», а не частота проверки цен. Скрипт запускается по нему,
    # забирает команды из Telegram и решает, пора ли опрашивать источники —
    # по значению check_interval_minutes (команда /freq).
    # Каждые 30 минут = ~1440 запусков в месяц. Для приватного репозитория
    # это почти весь бесплатный лимит Actions, см. README.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Проверить и прислать цены, игнорируя интервал и пороги"
        type: boolean
        default: false
      command:
        description: "Команда из Telegram — заполняется воркером, вручную не нужно"
        type: string
        required: false
        default: ""
      chat_id:
        description: "Отправитель команды — заполняется воркером"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Браузер нужен только если включён скрапер сайта авиакомпании.
      # Ставится он около минуты, поэтому проверяем, нужен ли он вообще.
      - name: Check if browser sources are enabled
        id: scrapers
        run: |
          python - << 'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          src = {}
          p = pathlib.Path("settings.json")
          if p.exists():
              src = json.loads(p.read_text()).get("sources", {})
          need = any(src.get(n) for n in ("pegasus", "ajet"))
          print(f"needed={'true' if need else 'false'}")
          EOF

      - name: Install Playwright
        if: steps.scrapers.outputs.needed == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_COMMAND: ${{ inputs.command }}
          TELEGRAM_COMMAND_CHAT: ${{ inputs.chat_id }}
        run: python monitor.py ${{ inputs.force && '--force' || '' }}

      - name: Save history and settings
        if: always()
        continue-on-error: true
        run: |
          set +e    # шаг не должен ронять запуск: уведомления важнее истории

          git config user.name "flight-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== состояние репозитория ==="
          git status --short --branch
          echo "ветка: ${GITHUB_REF_NAME}"

          # Именно git add -A, а не перечисление файлов: settings.json и
          # airports-db.json создаются не сразу, а git add на отсутствующий
          # файл падает с кодом 128.
          git add -A
          if git diff --staged --quiet; then
            echo "нечего сохранять, изменений нет"
            exit 0
          fi

          git commit -m "update $(date -u '+%Y-%m-%d %H:%M')"
          if [ $? -ne 0 ]; then
            echo "!!! COMMIT НЕ ПРОШЁЛ (текст ошибки выше)"
            exit 0
          fi

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

          # HEAD:ветка работает и при detached HEAD после checkout.
          echo "=== push ==="
          git push origin "HEAD:${GITHUB_REF_NAME}"
          code=$?

          if [ $code -ne 0 ]; then
            echo ""
            echo "!!! PUSH НЕ ПРОШЁЛ, код $code. Текст ошибки — строкой выше."
            echo ""
            echo "Если написано 'Permission ... denied to github-actions[bot]':"
            echo "  Settings -> Actions -> General -> Workflow permissions"
            echo "  -> Read and write permissions -> Save"
            echo ""
            echo "Если 'protected branch' — Settings -> Branches, снять правило с main."
          else
            echo "история сохранена"
          fi
          exit 0
