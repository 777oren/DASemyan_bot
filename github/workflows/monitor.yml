name: flight-price-monitor

on:
  schedule:
    # Это «пульс», а не частота проверки цен. Скрипт запускается по нему,
    # забирает команды из Telegram и решает, пора ли опрашивать источники —
    # по значению check_interval_minutes (команда /freq).
    # Каждые 30 минут = ~1440 запусков в месяц. Для приватного репозитория
    # это почти весь бесплатный лимит Actions, см. README.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Проверить и прислать цены, игнорируя интервал и пороги"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Браузер нужен только если включён скрапер сайта авиакомпании.
      # Ставится он около минуты, поэтому проверяем, нужен ли он вообще.
      - name: Check if browser sources are enabled
        id: scrapers
        run: |
          python - << 'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          src = {}
          p = pathlib.Path("settings.json")
          if p.exists():
              src = json.loads(p.read_text()).get("sources", {})
          need = any(src.get(n) for n in ("pegasus", "ajet"))
          print(f"needed={'true' if need else 'false'}")
          EOF

      - name: Install Playwright
        if: steps.scrapers.outputs.needed == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py ${{ inputs.force && '--force' || '' }}

      - name: Save history and settings
        if: always()
        run: |
          git config user.name "flight-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json settings.json airports-db.json
          git diff --staged --quiet || git commit -m "update $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
