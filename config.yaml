# ============================================================
#  Общие настройки. Маршруты здесь больше не задаются —
#  они добавляются и удаляются командами бота:
#      /add AMS SAW 2027-02-14 2027-02-28
#      /routes
#      /del 2
#  и хранятся в settings.json.
#
#  Пороги и частота тоже настраиваются из чата (/drop, /max,
#  /freq). Значения из блока alerts используются только до
#  первой команды — дальше приоритет у settings.json.
# ============================================================

currency: eur
market: ru          # кэш какого сайта Aviasales брать: ru, us, tr, nl...

alerts:
  drop_percent: 5              # уведомить при падении цены на столько %
  max_price: 400               # уведомить при любой цене ниже; null — выключить
  rise_percent: 15             # предупредить о росте; null — выключить
  check_interval_minutes: 60   # как часто реально проверять цены
  paused: false

# Какие источники опрашивать. Меняется командой /source.
# travelpayouts работает сразу. pegasus и ajet — скраперы сайтов
# авиакомпаний, их нужно откалибровать (python calibrate.py pegasus).
sources:
  travelpayouts: true
  pegasus: false
  ajet: false

# Маршруты добавляются через бота. Список оставлен пустым намеренно.
#
# Если всё же нужен маршрут, зашитый в репозиторий и защищённый
# от удаления из чата, его можно описать здесь по такому образцу:
#
# routes:
#   - name: "Амстердам → Стамбул, февраль"
#     origin: AMS
#     destination: SAW
#     departure_at: "2027-02-14"
#     return_at: "2027-02-28"
#     one_way: false
#     direct: false
#     airlines: [PC, VF]          # PC — Pegasus, VF — AJet
#     max_transfers: 1
#     max_duration_minutes: 1800
routes: []

# ------------------------------------------------------------
#  Скраперы сайтов авиакомпаний.
#  Заполняется автоматически: python calibrate.py pegasus
# ------------------------------------------------------------
scrapers:
  pegasus:
    airline_code: PC
    # url_template: "https://www.flypgs.com/en/..."
    # json_url_contains: ""
    wait_ms: 15000
    locale: en-US
    timezone: Europe/Istanbul
    min_price: 10

  ajet:
    airline_code: VF
    # url_template: "https://www.ajet.com/en/..."
    # json_url_contains: ""
    wait_ms: 15000
    locale: en-US
    timezone: Europe/Istanbul
    min_price: 10
